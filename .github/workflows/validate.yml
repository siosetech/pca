# Validate every config in the lab, and render the journal, on each push.
# The point is not CI theatre: `promtool check` catches the exact class of
# mistake the exam asks about, so a red build is a study prompt.

name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  configs:
    name: Lab configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prometheus - check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/lab/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Prometheus - check rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/lab/prometheus/rules:/rules:ro" \
            prom/prometheus:latest \
            check rules /rules/recording.yml /rules/alerting.yml

      - name: Alertmanager - check config
        run: |
          docker run --rm --entrypoint amtool \
            -v "${{ github.workspace }}/lab/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:latest \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Blackbox - parse config
        run: python3 -c "import yaml; yaml.safe_load(open('lab/blackbox/config.yml')); print('blackbox config ok')"

      - name: Grafana dashboards - valid JSON
        run: |
          for f in lab/grafana/dashboards/*.json; do
            python3 -c "import json; json.load(open('$f')); print('$f ok')"
          done

      - name: Sample app - syntax check
        run: python3 -m py_compile lab/sample-app/app.py

      - name: Remaining TODOs in the notes
        run: |
          echo "Open TODOs (informational, does not fail the build):"
          grep -rn "TODO" content/notes/ progress/ || echo "  none - notes are complete"

  journal:
    name: Lab journal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --failure-level=WARN is the whole point of this job. A journal entry
      # includes real config files by tag; if a tag is renamed or removed,
      # asciidoctor warns and this build goes red. The write-up can never
      # drift from the config it describes without CI noticing.
      - name: Render HTML
        run: |
          mkdir -p build
          docker run --rm -v "${{ github.workspace }}:/documents" \
            docker.io/asciidoctor/docker-asciidoctor \
            asciidoctor -a data-uri -a toc=left -a icons=font \
              --failure-level=WARN \
              -D /documents/build -o pca-lab-journal.html journal/index.adoc

      - name: Render PDF
        run: |
          docker run --rm -v "${{ github.workspace }}:/documents" \
            docker.io/asciidoctor/docker-asciidoctor \
            asciidoctor-pdf --failure-level=WARN \
              -D /documents/build -o pca-lab-journal.pdf journal/index.adoc

      - name: Upload the rendered journal
        uses: actions/upload-artifact@v4
        with:
          name: lab-journal
          path: build/
          retention-days: 30

  study:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
