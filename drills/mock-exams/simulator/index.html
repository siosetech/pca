  const rows = S.filter === "wrong" ? g.rows.filter(r => !r.ok)
             : S.filter === "flag"  ? g.rows.filter(r => S.flags[r.i])
             : g.rows;

  return `
  <div class="wrap stack">

    <div class="panel">
      <div class="score-panel">
        <div class="score-top">
          <div class="score-num ${passed ? "pass" : "fail"}">${g.pct}<span style="font-size:26px">%</span></div>
          <div class="score-meta">
            <div class="big">${g.right} of ${g.total} correct &middot; ${passed ? "above" : "below"} the ${Math.round(PASS*100)}% pass mark</div>
            <div class="sub">${S.cfg.mode === "exam" ? "Exam mode" : "Practice mode"} &middot; ${mmss(S.elapsed)} elapsed${
              S.cfg.mode === "exam" ? " of " + mmss(S.items.length * SEC_PER_Q) : ""}</div>
          </div>
        </div>

        <div class="slo">
          <div class="slo-track">
            <div class="slo-fill ${passed ? "" : "fail"}" style="width:${g.pct}%"></div>
            <div class="slo-mark" style="left:${PASS*100}%"></div>
          </div>
          <div class="slo-labels"><span>0%</span><span>pass ${Math.round(PASS*100)}%</span><span>100%</span></div>
          <p class="slo-cap">Think of it as an error budget: ${budget} wrong answers were affordable, and you
            spent ${missed}. ${passed
              ? (missed <= budget - 3 ? "Comfortable margin." : "Over the line, but with little room to spare.")
              : "Over budget by " + (missed - budget) + "."}</p>
        </div>
      </div>
    </div>

    <div>
      <div class="sec-h"><h2>By domain</h2><span>the threshold line marks ${Math.round(PASS*100)}%</span></div>
      <div class="panel"><div class="panel-b">
        <div class="dom">
          ${DOMAINS.filter(d => g.per[d.key]).map(d => {
            const p = g.per[d.key], pct = Math.round(p.right / p.total * 100);
            const cls = pct >= 75 ? "g" : pct >= 60 ? "a" : "r";
            return `
              <div class="dom-row">
                <div class="dom-name">${d.name}<em>${Math.round(d.weight*100)}% of exam</em></div>
                <div class="dom-val">${p.right}/${p.total} &nbsp;${pct}%</div>
                <div class="dom-track"><div class="dom-fill ${cls}" style="width:${pct}%"></div><div class="dom-thresh"></div></div>
              </div>`;
          }).join("")}
        </div>
      </div></div>
    </div>

    <div>
      <div class="sec-h"><h2>Review</h2><span>every question, with the reasoning and where it is covered</span></div>
      <div class="filters opts" data-set="filter">
        <button class="opt" aria-pressed="${S.filter==='all'}"   data-v="all">All ${g.total}</button>
        <button class="opt" aria-pressed="${S.filter==='wrong'}" data-v="wrong">Missed ${g.total - g.right}</button>
        <button class="opt" aria-pressed="${S.filter==='flag'}"  data-v="flag">Flagged ${S.flags.filter(Boolean).length}</button>
      </div>
      <div class="rev" style="margin-top:14px">
        ${rows.length ? rows.map(r => `
          <div class="rev-item ${r.ok ? "right" : "wrong"}">
            <div class="rev-head">
              <span class="qnum mono">${String(r.i + 1).padStart(2,"0")}</span>
              <span class="pill">${DMAP[r.q.domain].name}</span>
              <span class="tag ${r.ok ? "pass" : "fail"}">${r.ok ? "correct" : "missed"}</span>
              ${S.flags[r.i] ? `<span class="pill" style="color:var(--warn);border-color:var(--warn)">flagged</span>` : ""}
            </div>
            <div class="rev-q">${fmtStem(r.q.q)}</div>
            <div class="rev-ans">
              <div><b>You</b><span>${r.picked.length
                ? r.picked.map(i => LETTERS[i] + ". " + fmtOpt(r.q.opts[i])).join("<br>")
                : "<em style='color:var(--faint)'>no answer</em>"}</span></div>
              ${r.ok ? "" : `<div><b>Correct</b><span>${r.q.ans.map(i => LETTERS[i] + ". " + fmtOpt(r.q.opts[i])).join("<br>")}</span></div>`}
            </div>
            <div class="rev-why">${fmtStem(r.q.why)}</div>
            <div class="rev-ref">${esc(r.q.ref)}</div>
          </div>`).join("")
        : `<p style="color:var(--muted);font-size:14px">Nothing in this filter.</p>`}
      </div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" id="againBtn">New attempt</button>
      <button class="btn btn-lg" id="retryBtn" ${g.right === g.total ? "disabled" : ""}>Retry the ${g.total - g.right} I missed</button>
    </div>
  </div>`;
}

/* ══ chrome ══════════════════════════════════════════════════════════════ */
function barTools(){
  if (S.view === "exam"){
    const left = S.cfg.mode === "exam" ? (S.deadline - Date.now()) / 1000 : (Date.now() - S.startedAt) / 1000;
    const cls = S.cfg.mode === "exam" ? (left < 300 ? "crit" : left < 900 ? "warn" : "") : "";
    return `<span class="pill">${S.idx + 1} / ${S.items.length}</span>
            <span class="clock ${cls}" id="clock">${mmss(left)}</span>
            <button class="btn" id="navBtn">Navigator</button>`;
  }
  if (S.view === "results")
    return `<span class="pill">${S.res.right} / ${S.res.total}</span><button class="btn" id="homeBtn">Home</button>`;
  return `<span class="pill">${BANK.length} questions in bank</span>`;
}

function paint(){
  const app = $("#app");
  app.innerHTML = S.view === "start" ? viewStart() : S.view === "exam" ? viewExam() : viewResults();
  $("#barTools").innerHTML = barTools();
  $("#overlay").innerHTML = S.sheet ? viewNavigator() : "";
  $("#progFill").style.width =
    S.view === "exam"    ? ((S.idx + 1) / S.items.length * 100) + "%" :
    S.view === "results" ? "100%" : "0%";
  $("#brandSub").textContent =
    S.view === "exam" ? (S.cfg.mode === "exam" ? "Exam conditions" : "Practice run") :
    S.view === "results" ? "Result" : "Prometheus Certified Associate";
  if (S.view !== "exam") window.scrollTo(0, 0);
}

/* ══ actions ═════════════════════════════════════════════════════════════ */
function startExam(){
  S.items = buildExam(S.cfg);
  S.picks = S.items.map(() => []);
  S.flags = S.items.map(() => false);
  S.idx = 0; S.revealed = false; S.confirmFinish = false; S.view = "exam";
  S.startedAt = Date.now();
  S.deadline = S.startedAt + S.items.length * SEC_PER_Q * 1000;
  clearInterval(S.tick);
  S.tick = setInterval(() => {
    const c = $("#clock"); if (!c) return;
    const left = S.cfg.mode === "exam" ? (S.deadline - Date.now()) / 1000 : (Date.now() - S.startedAt) / 1000;
    c.textContent = mmss(left);
    c.className = "clock " + (S.cfg.mode === "exam" ? (left < 300 ? "crit" : left < 900 ? "warn" : "") : "");
    if (S.cfg.mode === "exam" && left <= 0) finish();
  }, 1000);
  paint();
}

function finish(){
  clearInterval(S.tick);
  S.elapsed = (Date.now() - S.startedAt) / 1000;
  S.res = grade();
  S.view = "results"; S.sheet = false; S.filter = "all";
  remember({ date: new Date().toLocaleString(), pct: S.res.pct, count: S.res.total, mode: S.cfg.mode });
  paint();
}

function go(i){
  S.idx = Math.max(0, Math.min(S.items.length - 1, i));
  S.revealed = false; S.confirmFinish = false;
  paint();
  window.scrollTo(0, 0);
}

function choose(i){
  const q = S.items[S.idx];
  if (S.revealed) return;
  let p = S.picks[S.idx].slice();
  if (q.type === "multi"){
    p = p.includes(i) ? p.filter(x => x !== i) : (p.length < q.ans.length ? p.concat(i) : p);
  } else {
    p = p.includes(i) ? [] : [i];
  }
  S.picks[S.idx] = p.sort((a, b) => a - b);
  paint();
}
</script>
<script>
/* ══ events ══════════════════════════════════════════════════════════════ */
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;

  const setBox = t.closest("[data-set]");
  if (setBox){
    const set = setBox.dataset.set, v = t.dataset.v;
    if (set === "mode")   S.cfg.mode = v;
    if (set === "count")  S.cfg.count = +v;
    if (set === "filter") S.filter = v;
    if (set === "domain"){
      const d = S.cfg.domains;
      S.cfg.domains = d.includes(v) ? d.filter(x => x !== v) : DOMAINS.map(x => x.key).filter(k => d.includes(k) || k === v);
    }
    return paint();
  }

  if (t.id === "startBtn") return startExam();
  if (t.dataset.i !== undefined) return choose(+t.dataset.i);
  if (t.id === "prevBtn")   return go(S.idx - 1);
  if (t.id === "nextBtn")   return go(S.idx + 1);
  if (t.id === "checkBtn"){ S.revealed = true; return paint(); }
  if (t.id === "flagBtn"){  S.flags[S.idx] = !S.flags[S.idx]; return paint(); }
  if (t.id === "navBtn"){   S.sheet = true;  return paint(); }
  if (t.id === "closeSheet" || t.id === "closeSheet2"){ S.sheet = false; return paint(); }
  if (t.dataset.goto !== undefined){ S.sheet = false; return go(+t.dataset.goto); }
  if (t.id === "finishBtn" || t.id === "finishFromSheet"){
    const blank = S.picks.filter(p => !p.length).length;
    if (blank && !S.confirmFinish){ S.confirmFinish = true; S.sheet = false; return paint(); }
    return finish();
  }
  if (t.id === "cancelFinish"){ S.confirmFinish = false; return paint(); }
  if (t.id === "againBtn" || t.id === "homeBtn"){ S.view = "start"; clearInterval(S.tick); return paint(); }
  if (t.id === "retryBtn"){
    const missed = S.res.rows.filter(r => !r.ok).map(r => r.q);
    S.items = shuffle(missed);
    S.picks = S.items.map(() => []); S.flags = S.items.map(() => false);
    S.idx = 0; S.revealed = false; S.view = "exam";
    S.startedAt = Date.now(); S.deadline = S.startedAt + S.items.length * SEC_PER_Q * 1000;
    return paint();
  }
});

document.addEventListener("keydown", e => {
  if (S.view !== "exam" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "4"){ e.preventDefault(); return choose(+k - 1); }
  if (k === "a" || k === "b" || k === "c" || k === "d"){ e.preventDefault(); return choose("abcd".indexOf(k)); }
  if (e.key === "ArrowRight"){ e.preventDefault(); return S.idx < S.items.length - 1 ? go(S.idx + 1) : null; }
  if (e.key === "ArrowLeft"){  e.preventDefault(); return go(S.idx - 1); }
  if (k === "f"){ e.preventDefault(); S.flags[S.idx] = !S.flags[S.idx]; return paint(); }
  if (k === "n"){ e.preventDefault(); S.sheet = !S.sheet; return paint(); }
  if (e.key === "Escape" && S.sheet){ S.sheet = false; return paint(); }
  if (e.key === "Enter" && S.cfg.mode === "practice" && !S.revealed && S.picks[S.idx].length){
    e.preventDefault(); S.revealed = true; return paint();
  }
});

paint();
</script>

</body>
</html>
