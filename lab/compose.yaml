# PCA lab stack — run with:  podman compose up -d
#
# Everything is fully-qualified (docker.io/...) because Podman does not assume
# a default registry.
#
# > TODO: once the stack works, replace `:latest` with pinned versions
# >       (`podman images --digests`) so the lab is reproducible.

name: pca-lab

services:

  # ── The Prometheus server itself ────────────────────────────────────────────
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: pca-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # allows POST /-/reload
      - --web.enable-admin-api          # allows the delete-series API
      - --log.level=info
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prom-data:/prometheus
    restart: unless-stopped

  # ── Routes, groups and silences the alerts Prometheus fires ────────────────
  alertmanager:
    image: docker.io/prom/alertmanager:latest
    container_name: pca-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    restart: unless-stopped

  # ── Dashboards ─────────────────────────────────────────────────────────────
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: pca-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # lab only — no login prompt
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Host metrics: CPU, memory, disk, network (of the Podman machine) ───────
  node-exporter:
    image: docker.io/prom/node-exporter:latest
    container_name: pca-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    pid: host
    restart: unless-stopped

  # ── Black-box probing: HTTP / TCP / ICMP / DNS from the outside ────────────
  blackbox:
    image: docker.io/prom/blackbox-exporter:latest
    container_name: pca-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  # ── Holds metrics from short-lived batch jobs ──────────────────────────────
  pushgateway:
    image: docker.io/prom/pushgateway:latest
    container_name: pca-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  # ── A tiny instrumented app: counter, gauge, histogram, summary ────────────
  sample-app:
    build:
      context: ./apps/sample-app
      dockerfile: Containerfile
    image: localhost/pca-sample-app:latest
    container_name: pca-sample-app
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Generates traffic so the counters and histograms have something in them ─
  loadgen:
    image: docker.io/curlimages/curl:latest
    container_name: pca-loadgen
    depends_on:
      - sample-app
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          curl -s -o /dev/null "http://sample-app:8000/api/users"   || true
          curl -s -o /dev/null "http://sample-app:8000/api/orders"  || true
          curl -s -o /dev/null "http://sample-app:8000/api/slow"    || true
          curl -s -o /dev/null "http://sample-app:8000/api/flaky"   || true
          sleep 1
        done
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
  am-data:
