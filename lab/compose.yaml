name: pca-lab

# Run from this directory:
#   podman compose up -d --build
# Stop:
#   podman compose down

networks:
  pca:
    name: pca-lab

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  pushgateway-data:

services:
  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: pca-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [pca]
    restart: unless-stopped
    depends_on:
      - alertmanager
      - sample-app
      - node-exporter
      - blackbox
      - pushgateway

  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: pca-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [pca]
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.5.2
    container_name: pca-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pca
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pca-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [pca]
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: pca-node-exporter
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks: [pca]
    restart: unless-stopped

  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.25.0
    container_name: pca-blackbox
    command:
      - --config.file=/etc/blackbox/config.yml
    volumes:
      - ./blackbox/config.yml:/etc/blackbox/config.yml:ro
    ports:
      - "9115:9115"
    networks: [pca]
    restart: unless-stopped

  pushgateway:
    image: docker.io/prom/pushgateway:v1.10.0
    container_name: pca-pushgateway
    command:
      - --persistence.file=/data/pushgateway.db
    volumes:
      - pushgateway-data:/data
    ports:
      - "9091:9091"
    networks: [pca]
    restart: unless-stopped

  sample-app:
    build:
      context: ./sample-app
      dockerfile: Dockerfile
    image: localhost/pca-sample-app:latest
    container_name: pca-sample-app
    environment:
      ERROR_RATE: "0.28"
    ports:
      - "8000:8000"
    networks: [pca]
    restart: unless-stopped

  loadgen:
    image: docker.io/curlimages/curl:8.12.1
    container_name: pca-loadgen
    user: "0"
    volumes:
      - ./loadgen/run.sh:/run.sh:ro
    entrypoint: ["/bin/sh", "/run.sh"]
    networks: [pca]
    restart: unless-stopped
    depends_on:
      - sample-app
      - pushgateway
