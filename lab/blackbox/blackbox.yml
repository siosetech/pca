# Blackbox exporter modules. Prometheus selects one with  ?module=<name>.
modules:

  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: []        # empty means "any 2xx"
      preferred_ip_protocol: ip4
      follow_redirects: true

  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  dns_soa:
    prober: dns
    timeout: 5s
    dns:
      query_name: prometheus.io
      query_type: SOA
