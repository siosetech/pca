# tag::global[]
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: pca-lab
    replica: laptop
# end::global[]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          team: sre
    # After scrape: drop Go runtime series. Contrast with relabel_configs (targets).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: go_.*
        action: drop

  - job_name: sample-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - sample-app:8000
        labels:
          team: shop
          env: lab

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          team: sre

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          team: sre

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
        labels:
          team: sre

  # honor_labels keeps the job/instance labels that the short-lived job pushed
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
        labels:
          team: batch

  # Blackbox probes: Prometheus pulls /probe and tells blackbox what to check
# tag::blackbox[]
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://sample-app:8000/health
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/api/health
        labels:
          team: sre
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
# end::blackbox[]

  # File-based service discovery — edit file_sd/targets.yml and wait ~30s
  - job_name: file-sd
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [team]
        regex: dropme
        action: drop
