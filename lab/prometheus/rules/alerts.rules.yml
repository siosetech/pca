# Alerting rules.
# State machine:  inactive -> pending (expr true) -> firing (true for `for`)
# Only FIRING alerts are sent to Alertmanager.

groups:

  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for over a minute."

      - alert: TargetMissing
        # `up == 0` cannot fire for a target that no longer exists at all.
        expr: absent(up{job="sample-app"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The sample-app job has disappeared from service discovery"

      - alert: ProbeFailing
        expr: probe_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Blackbox probe to {{ $labels.instance }} is failing"

  - name: slo
    rules:
      - alert: HighErrorRate
        expr: job:app_requests:error_ratio5m > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $labels.job }} error ratio is {{ $value | humanizePercentage }}"
          description: "More than 5% of requests have failed for 2 minutes."

      - alert: HighLatencyP95
        expr: job:app_request_duration_seconds:p95_5m > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "p95 latency is {{ $value | printf \"%.2f\" }}s for {{ $labels.job }}"

  - name: capacity
    rules:
      - alert: HighCpu
        expr: instance:node_cpu_utilisation:ratio5m > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} at {{ $value | humanizePercentage }}"

      - alert: DiskWillFillIn4Hours
        # The classic predict_linear alert. Gauge in, extrapolation out.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[1h], 4 * 3600) < 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 4 hours"
