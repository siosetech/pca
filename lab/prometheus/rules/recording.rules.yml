# Recording rules — precompute expensive expressions.
# Naming convention: level:metric:operations
# Rules in the SAME group run sequentially, so later rules may use earlier ones.
# Different groups run in parallel — never depend across groups.

groups:

  - name: http.rules
    interval: 15s
    rules:
      - record: job:app_requests:rate5m
        expr: sum by (job) (rate(app_requests_total[5m]))

      - record: job:app_requests_errors:rate5m
        expr: sum by (job) (rate(app_requests_total{status=~"5.."}[5m]))

      # Uses the two rules above — legal because they are in this same group.
      - record: job:app_requests:error_ratio5m
        expr: |
          job:app_requests_errors:rate5m
            / job:app_requests:rate5m

      - record: job:app_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (rate(app_request_duration_seconds_bucket[5m]))
          )

  - name: node.rules
    interval: 30s
    rules:
      - record: instance:node_cpu_utilisation:ratio5m
        expr: |
          1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

      - record: instance:node_memory_utilisation:ratio
        expr: |
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
